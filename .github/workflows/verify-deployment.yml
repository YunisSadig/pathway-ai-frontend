# Post-deployment verification of the protected staging site. Vercel's Git integration deploys main (vercel.json) and reports the result as
# a commit STATUS with the context "Vercel" (it creates no GitHub Deployment, so deployment_status never fires). This workflow runs when that
# status turns successful for the head of main: it waits until the site serves the merged commit, runs the deployment health script, then a
# real-browser smoke test against the live site and the live API behind it. It never deploys anything and a failed CI never reaches main
# (changes enter main only through pull requests that passed CI).
#
# It does nothing until the repository VARIABLE STAGING_SITE_URL is set and the environment "production" holds the secret SITE_BASIC_AUTH
# (docs/deployment.md).
name: Verify deployment

on:
  status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-deployment
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ vars.STAGING_SITE_URL != '' && (github.event_name == 'workflow_dispatch' || (github.event.context == 'Vercel' && github.event.state == 'success' && github.event.sha == github.sha)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      LIVE_SITE_URL: ${{ vars.STAGING_SITE_URL }}
      SITE_BASIC_AUTH: ${{ secrets.SITE_BASIC_AUTH }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for the merged commit to be served, then check health
        run: node scripts/verify-deployment.mjs "$LIVE_SITE_URL" same-origin
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test against the live site
        run: npx playwright test -c playwright.live.config.ts
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-traces
          path: test-results
