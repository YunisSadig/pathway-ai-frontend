# Weekly dependency and workflow-action update PRs; each runs the normal CI (format, lint, typecheck, unit, build, e2e) before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must always have exactly the same version (a lone react bump fails with "Incompatible React versions")
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # deliberate, separate upgrades: the compiler's next major and type definitions newer than the Node runtime (24 LTS)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
